name: Java CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile Java source
        run: javac -Xlint:all -d build src/PortScanner.java tests/PortScannerValidationTest.java
      - name: Run validation tests
        run: java -cp build PortScannerValidationTest
